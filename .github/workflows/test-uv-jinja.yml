name: test-uv-jinja

on:
  push:
    branches: [DEVOPS-8235-test-uv-jinja]

jobs:
  test-uv-jinja:
    name: python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.5"
          enable-cache: auto
      
      - name: Set up uv Python
        run: |
          uv python install
          python --version
        
      - name: Do test
        run: uv run .github/workflows/scripts/test_uv_jinja.py -l debug
