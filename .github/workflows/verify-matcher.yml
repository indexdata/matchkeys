name: verify-matcher

env:
  documentation: 'https://github.com/indexdata/reservoir-scripts/blob/main/js/README.md#conduct-tests'
  NODEJS_VERSION: '24'

on:
  push:
    paths:
      - '**.mjs'
      - '**.js'
      - 'js/test/**.json'
      - '.github/workflows/verify-matcher.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.mjs'
      - '**.js'
      - 'js/test/**.json'

permissions:
  contents: read

jobs:
  verify-matcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show documentation
        run: |
          echo "Documentation: ${{ env.documentation }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Do setup-node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODEJS_VERSION }}
          check-latest: true

      - name: Do npm install
        run: npm install

      - name: Get list of files
        id: files
        uses: hanseltimeindustries/get-changed-files@v1

      - name: Show list of files
        run: |
          for changed_file in ${{ steps.files.outputs.all }}; do
            echo "changed_file: ${changed_file}"
          done

      - name: Determine matchers
        id: determine-matchers
        env:
          FILES_LIST: ${{ steps.files.outputs.all }}
        run: |
          matchers=$(python3 ../.github/workflows/scripts/determine_matchers.py -l info)
          echo "matchers=$matchers" | tee -a "$GITHUB_OUTPUT"

      - name: Show determined matchers
        env:
          MATCHERS: ${{ steps.determine-matchers.outputs.matchers }}
        run: |
          if [ -n "$MATCHERS" ]; then
            echo "Determined modified matchers: $MATCHERS" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No modified matchers were determined." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run test of relevant matchers
        env:
          MATCHERS: ${{ steps.determine-matchers.outputs.matchers }}
        if: ${{ steps.determine-matchers.outputs.matchers != '' }}
        run: |
          echo "See the run step logs for test results." >> "$GITHUB_STEP_SUMMARY"
          for matcher in $MATCHERS; do
            test_script="test/${matcher}.mjs"
            if [ -f "$test_script" ]; then
              echo "Running test: ${matcher} ..." | tee -a "$GITHUB_STEP_SUMMARY"
              npm run "test-${matcher}"
            else
              echo "The test script '${test_script}' does not exist."
              exit 1
            fi
          done
